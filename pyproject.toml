[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cainiao-inventory-optimization"
version = "0.1.0"
description = "Cost-sensitive demand forecasting and multi-warehouse inventory planning"
requires-python = ">=3.11"

[project.optional-dependencies]
deep-learning = ["torch>=2.4,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
